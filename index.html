<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabelBMD Lamsel — Generator Label Inventaris Pemkab Lampung Selatan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    .bmd-sticker {
      background: #ffffff;
      color: #0f172a;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .bmd-sticker.with-border { border: 1.5px solid #0f172a; }

    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      body { background: #ffffff !important; margin: 0 !important; }
      .no-print { display: none !important; }
      #print-area-wrapper { border: none !important; box-shadow: none !important; padding: 0 !important; }
      #print-grid { display: flex !important; flex-wrap: wrap !important; gap: 8px !important; }
      .bmd-sticker { break-inside: avoid !important; page-break-inside: avoid !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- HEADER -->
  <header class="no-print bg-emerald-900 text-white shadow sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-amber-400 text-emerald-950 flex items-center justify-center font-black shadow">
          🛡️
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">LabelBMD Lamsel</h1>
          <p class="text-[11px] text-emerald-200">Standar BPKAD / Inspektorat Kab. Lampung Selatan (18.01)</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportCSV()" class="px-3 py-1.5 text-xs font-semibold bg-emerald-800 hover:bg-emerald-700 border border-emerald-600 rounded-lg transition">
          📥 Ekspor CSV
        </button>
        <button onclick="window.print()" class="px-4 py-1.5 text-xs font-bold bg-amber-400 hover:bg-amber-300 text-emerald-950 rounded-lg shadow transition">
          🖨️ Cetak Stiker (<span id="total-print-badge">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA: GRID 2 KOLOM -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- KOLOM KIRI: FORM INPUT LENGKAP & CEPAT (Lebar 5 Kolom) -->
    <section class="no-print lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
      <div class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <h2 class="text-xs font-extrabold text-emerald-900 uppercase tracking-wider">Form Pembuatan Label BMD</h2>
        <div class="flex gap-1">
          <button type="button" onclick="setInstansi('SDN 1 Kalianda')" class="text-[10px] px-2 py-0.5 bg-slate-100 hover:bg-emerald-50 text-slate-700 rounded font-medium">Sekolah</button>
          <button type="button" onclick="setInstansi('Kantor Camat Natar')" class="text-[10px] px-2 py-0.5 bg-slate-100 hover:bg-emerald-50 text-slate-700 rounded font-medium">Kecamatan</button>
        </div>
      </div>

      <!-- 1. Identitas OPD / Sekolah -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">Nama Instansi / Sekolah / OPD</label>
        <input type="text" id="input-opd" value="SDN 1 Kalianda" oninput="updatePreview()" class="w-full px-3 py-2 text-xs font-semibold border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 outline-none" />
      </div>

      <!-- 2. Pengkodean BMD & Kecamatan -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kecamatan Lamsel</label>
          <select id="select-kecamatan" onchange="generateKode()" class="w-full px-2.5 py-2 text-xs border border-slate-300 rounded-lg bg-white">
            <option value="04">04 - Natar</option>
            <option value="05">05 - Tanjung Bintang</option>
            <option value="06" selected>06 - Kalianda</option>
            <option value="07">07 - Sidomulyo</option>
            <option value="08">08 - Katibung</option>
            <option value="09">09 - Penengahan</option>
            <option value="10">10 - Palas</option>
            <option value="11">11 - Jati Agung</option>
            <option value="12">12 - Ketapang</option>
            <option value="13">13 - Sragi</option>
            <option value="14">14 - Raja Basa</option>
            <option value="15">15 - Candipuro</option>
            <option value="16">16 - Merbau Mataram</option>
            <option value="17">17 - Bakauheni</option>
            <option value="18">18 - Tanjung Sari</option>
            <option value="19">19 - Way Sulan</option>
            <option value="20">20 - Way Panji</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nomor Urut / Register</label>
          <div class="flex gap-1">
            <input type="number" id="input-urut" value="1" min="1" max="9999" oninput="generateKode()" class="w-full px-2 py-2 text-xs font-bold border border-slate-300 rounded-lg text-center" />
            <button type="button" onclick="incrementUrut()" class="px-2 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-bold rounded-lg">+1</button>
          </div>
        </div>
      </div>

      <!-- 3. Kategori Barang -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Kategori Barang Standar</label>
        <select id="select-kategori" onchange="onKategoriChange()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white">
          <option value="02.02.01.01.01|LP|Laptop / Komputer" selected>Laptop / Komputer (-LP-)</option>
          <option value="02.02.01.02.01|PR|Printer / Scanner">Printer / Scanner (-PR-)</option>
          <option value="02.02.01.03.01|MJ|Meja Kerja">Meja Kerja / Siswa (-MJ-)</option>
          <option value="02.02.01.03.02|KR|Kursi Kerja">Kursi Kerja / Siswa (-KR-)</option>
          <option value="02.02.01.04.01|LM|Lemari Arsip">Lemari Arsip / Rak (-LM-)</option>
          <option value="02.02.01.05.01|AC|AC / Kipas">AC / Pendingin Ruangan (-AC-)</option>
          <option value="02.02.01.06.01|PRJ|Proyektor">Proyektor / LCD (-PRJ-)</option>
          <option value="02.02.02.01.01|R2|Kendaraan Roda 2">Kendaraan Roda 2 (-R2-)</option>
        </select>
      </div>

      <!-- Hasil Kode Final -->
      <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg">
        <label class="text-[10px] font-bold text-emerald-800 uppercase block mb-1">Kode BMD Final (Otomatis)</label>
        <input type="text" id="input-kode-final" value="18.01.06-LP-001" oninput="updatePreview()" class="w-full px-3 py-1.5 text-xs font-mono-code font-bold bg-white border border-emerald-400 rounded text-emerald-950" />
      </div>

      <!-- 4. Nama Barang Spesifik -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nama / Merk Barang</label>
        <input type="text" id="input-nama-barang" value="Laptop Lenovo ThinkPad" oninput="updatePreview()" class="w-full px-3 py-2 text-xs font-semibold border border-slate-300 rounded-lg" />
      </div>

      <!-- 5. Tahun, Kondisi, Lokasi -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Tahun Perolehan</label>
          <input type="number" id="input-tahun" value="2024" oninput="updatePreview()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kondisi</label>
          <select id="select-kondisi" onchange="updatePreview()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white">
            <option value="Baik" selected>Baik (B)</option>
            <option value="Rusak Ringan">Rusak Ringan (RR)</option>
            <option value="Rusak Berat">Rusak Berat (RB)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Lokasi / Ruangan</label>
          <input type="text" id="input-lokasi" value="Lab Komputer" oninput="updatePreview()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Sumber Dana</label>
          <select id="select-dana" onchange="updatePreview()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white">
            <option value="Dana BOS" selected>Dana BOS</option>
            <option value="APBD">APBD Lamsel</option>
            <option value="Dana Desa">Dana Desa</option>
          </select>
        </div>
      </div>

      <!-- Tombol Tambah ke Antrean -->
      <button type="button" onclick="addToQueue(true)" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-lg shadow transition flex items-center justify-center gap-2">
        <span>➕ Tambah ke Antrean Cetak & Auto +1</span>
      </button>
    </section>

    <!-- KOLOM KANAN: LIVE PREVIEW & DAFTAR ANTREAN (Lebar 7 Kolom) -->
    <section class="lg:col-span-7 space-y-6">

      <!-- Live Preview Card -->
      <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Pratinjau Stiker Live</h2>
        <div class="bg-slate-100 border border-dashed border-slate-300 rounded-xl p-6 flex items-center justify-center min-h-[160px]">
          <div id="live-preview-container"></div>
        </div>
      </div>

      <!-- Daftar Antrean -->
      <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Antrean Cetak (<span id="queue-count">0</span> Item)</h2>
          <button type="button" onclick="clearQueue()" class="text-xs text-red-600 hover:underline font-semibold">Kosongkan</button>
        </div>
        <div id="queue-list" class="max-h-52 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-lg text-xs">
          <!-- Diisi JS -->
        </div>
      </div>

      <!-- Area Lembar Cetak A4 -->
      <div id="print-area-wrapper" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="no-print flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
          <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Lembar Stiker Siap Cetak (A4)</h2>
          <button type="button" onclick="window.print()" class="px-3 py-1 bg-emerald-700 text-white text-xs font-bold rounded shadow">🖨️ Cetak</button>
        </div>
        <div id="print-grid" class="flex flex-wrap gap-3 justify-start">
          <!-- Stiker hasil cetak -->
        </div>
      </div>

    </section>

  </main>

  <script>
    let labelQueue = JSON.parse(localStorage.getItem('bmd_queue_v2')) || [
      { id: 1, opd: 'SDN 1 Kalianda', kode: '18.01.06-LP-001', nama: 'Laptop Lenovo ThinkPad', tahun: '2024', kondisi: 'Baik', lokasi: 'Lab Komputer', dana: 'Dana BOS' },
      { id: 2, opd: 'SDN 1 Kalianda', kode: '18.01.06-PR-001', nama: 'Printer Epson L3210', tahun: '2024', kondisi: 'Baik', lokasi: 'Ruang TU', dana: 'Dana BOS' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      generateKode();
      renderAll();
    });

    function setInstansi( nama ) {
      document.getElementById('input-opd').value = nama;
      updatePreview();
    }

    function onKategoriChange() {
      const val = document.getElementById('select-kategori').value.split('|');
      if(val[2]) {
        document.getElementById('input-nama-barang').value = val[2].split('/')[0].trim();
      }
      generateKode();
    }

    function incrementUrut() {
      const el = document.getElementById('input-urut');
      el.value = parseInt(el.value || '0', 10) + 1;
      generateKode();
    }

    function generateKode() {
      const kec = document.getElementById('select-kecamatan').value;
      const kat = document.getElementById('select-kategori').value.split('|')[1];
      const urut = String(document.getElementById('input-urut').value || '1').padStart(3, '0');
      
      const final = `18.01.${kec}-${kat}-${urut}`;
      document.getElementById('input-kode-final').value = final;
      updatePreview();
    }

    function getData() {
      return {
        opd: document.getElementById('input-opd').value.trim() || 'SDN 1 Kalianda',
        kode: document.getElementById('input-kode-final').value.trim() || '18.01.06-LP-001',
        nama: document.getElementById('input-nama-barang').value.trim() || 'Barang',
        tahun: document.getElementById('input-tahun').value.trim() || '2024',
        kondisi: document.getElementById('select-kondisi').value,
        lokasi: document.getElementById('input-lokasi').value.trim() || '-',
        dana: document.getElementById('select-dana').value
      };
    }

    function createStickerCard(item, uid) {
      const card = document.createElement('div');
      card.className = 'bmd-sticker with-border rounded-sm shadow-xs';
      card.style.width = '85mm';
      card.style.height = '45mm';

      let badgeStyle = 'background:#dcfce7;color:#166534;';
      if(item.kondisi === 'Rusak Ringan') badgeStyle = 'background:#fef9c3;color:#854d0e;';
      if(item.kondisi === 'Rusak Berat') badgeStyle = 'background:#fee2e2;color:#991b1b;';

      card.innerHTML = `
        <div style="background:#064e3b;color:#ffffff;padding:4px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #fbbf24;">
          <div style="line-height:1.1;">
            <div style="font-size:9px;font-weight:800;text-transform:uppercase;">PEMKAB LAMPUNG SELATAN</div>
            <div style="font-size:8px;font-weight:600;color:#fde68a;">${escapeHtml(item.opd)}</div>
          </div>
          <div style="font-size:7px;font-weight:800;background:#fbbf24;color:#064e3b;padding:1px 4px;border-radius:2px;">BMD 18.01</div>
        </div>
        <div style="flex:1;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;overflow:hidden;">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2.5px;">
            <div style="background:#f1f5f9;border:1px solid #cbd5e1;padding:1.5px 4px;border-radius:2px;">
              <div style="font-size:6.5px;color:#475569;font-weight:700;">KODE BARANG</div>
              <div class="font-mono-code" style="font-size:10px;font-weight:800;color:#0f172a;">${escapeHtml(item.kode)}</div>
            </div>
            <div style="font-size:10.5px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.nama)}</div>
            <div style="display:flex;align-items:center;gap:4px;font-size:8px;font-weight:600;color:#334155;">
              <span>Thn: <b>${escapeHtml(item.tahun)}</b></span> | 
              <span style="${badgeStyle}padding:0 3px;border-radius:2px;font-weight:700;">${escapeHtml(item.kondisi)}</span>
            </div>
            <div style="font-size:7.5px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Lok: <b>${escapeHtml(item.lokasi)}</b> • ${escapeHtml(item.dana)}</div>
          </div>
          <div id="qr-${uid}" style="shrink:0;"></div>
        </div>
      `;

      setTimeout(() => {
        const el = document.getElementById(`qr-${uid}`);
        if(el) {
          const payload = `PEMKAB LAMPUNG SELATAN\nUnit: ${item.opd}\nKode: ${item.kode}\nBarang: ${item.nama}\nTahun: ${item.tahun} | Kondisi: ${item.kondisi}\nLokasi: ${item.lokasi}`;
          new QRCode(el, { text: payload, width: 56, height: 56, colorDark: '#0f172a', colorLight: '#ffffff' });
        }
      }, 0);

      return card;
    }

    function updatePreview() {
      const container = document.getElementById('live-preview-container');
      container.innerHTML = '';
      container.appendChild(createStickerCard(getData(), 'live'));
    }

    function addToQueue(autoIncr = false) {
      const data = getData();
      labelQueue.push({ id: Date.now(), ...data });
      saveAndRender();
      if(autoIncr) incrementUrut();
    }

    function removeFromQueue(index) {
      labelQueue.splice(index, 1);
      saveAndRender();
    }

    function clearQueue() {
      if(confirm('Kosongkan antrean?')) { labelQueue = []; saveAndRender(); }
    }

    function saveAndRender() {
      localStorage.setItem('bmd_queue_v2', JSON.stringify(labelQueue));
      renderAll();
    }

    function renderAll() {
      updatePreview();
      const list = document.getElementById('queue-list');
      document.getElementById('queue-count').textContent = labelQueue.length;
      document.getElementById('total-print-badge').textContent = labelQueue.length;

      if(labelQueue.length === 0) {
        list.innerHTML = `<div class="p-4 text-center text-slate-400">Antrean kosong.</div>`;
      } else {
        list.innerHTML = labelQueue.map((item, idx) => `
          <div class="p-2.5 flex items-center justify-between gap-2 hover:bg-slate-50">
            <div>
              <div class="font-mono-code font-bold text-emerald-900">${escapeHtml(item.kode)}</div>
              <div class="font-semibold text-slate-800">${escapeHtml(item.nama)} <span class="text-slate-400 font-normal">(${item.tahun} - ${item.kondisi})</span></div>
              <div class="text-[10px] text-slate-500">${escapeHtml(item.opd)} • ${escapeHtml(item.lokasi)}</div>
            </div>
            <button onclick="removeFromQueue(${idx})" class="px-2 py-1 bg-red-50 text-red-600 font-bold rounded hover:bg-red-100">✕</button>
          </div>
        `).join('');
      }

      const grid = document.getElementById('print-grid');
      grid.innerHTML = '';
      labelQueue.forEach((item, idx) => {
        grid.appendChild(createStickerCard(item, `print-${idx}-${item.id}`));
      });
    }

    function exportCSV() {
      if(labelQueue.length === 0) return alert('Kosong');
      const csv = 'OPD,Kode,Barang,Tahun,Kondisi,Lokasi,Dana\n' + labelQueue.map(i => `"${i.opd}","${i.kode}","${i.nama}","${i.tahun}","${i.kondisi}","${i.lokasi}","${i.dana}"`).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'label-bmd.csv'; a.click();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
