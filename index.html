<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabelBMD Lamsel — Generator Label Inventaris Pemkab Lampung Selatan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Gaya Stiker Label BMD Lamsel */
    .bmd-sticker {
      background: #ffffff;
      color: #0f172a;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bmd-sticker.with-border {
      border: 1.8px solid #0f172a;
    }

    /* Pengaturan Khusus Cetak (@media print) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      #print-area-wrapper {
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        border: none !important;
      }

      #print-grid {
        display: flex !important;
        flex-wrap: wrap !important;
        align-content: flex-start !important;
        justify-content: flex-start !important;
      }

      .bmd-sticker {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body class="text-slate-800">

  <!-- HEADER APLIKASI (Disembunyikan saat cetak) -->
  <header class="no-print bg-emerald-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <!-- Ikon Perisai Pemkab Lamsel -->
        <div class="w-10 h-10 rounded-lg bg-amber-400 text-emerald-950 flex items-center justify-center font-extrabold shadow-inner shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 15l-4-4 1.41-1.41L12 14.17l6.59-6.59L20 9l-8 8z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight">LabelBMD Lamsel</h1>
            <span class="text-[11px] font-semibold bg-emerald-800 border border-emerald-600 px-2 py-0.5 rounded text-amber-300">Standar BPKAD / Inspektorat</span>
          </div>
          <p class="text-xs text-emerald-200">Generator Stiker Inventaris Barang Milik Daerah — Kab. Lampung Selatan (18.01)</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportCSV()" class="px-3 py-1.5 text-xs font-semibold bg-emerald-800 hover:bg-emerald-700 border border-emerald-600 rounded-lg transition flex items-center gap-1.5">
          <span>📥 Ekspor KIB (.CSV)</span>
        </button>
        <button onclick="window.print()" class="px-4 py-2 text-xs sm:text-sm font-bold bg-amber-400 hover:bg-amber-300 text-emerald-950 rounded-lg shadow transition flex items-center gap-1.5">
          <span>🖨️ Cetak Label (<span id="total-print-badge">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- PANEL KIRI: FORM INPUT & PENGATURAN (Disembunyikan saat cetak) -->
    <section class="no-print lg:col-span-5 space-y-5">

      <!-- 1. IDENTITAS UNIT KERJA -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">1. Identitas Unit Kerja / OPD</h2>
          <div class="flex gap-1">
            <button type="button" onclick="setInstansiPreset('SDN 1 Kalianda')" class="text-[11px] px-2 py-0.5 rounded bg-slate-100 hover:bg-emerald-100 text-slate-700 font-medium">Sekolah</button>
            <button type="button" onclick="setInstansiPreset('Kantor Camat Natar')" class="text-[11px] px-2 py-0.5 rounded bg-slate-100 hover:bg-emerald-100 text-slate-700 font-medium">OPD/Kec</button>
            <button type="button" onclick="setInstansiPreset('Pemerintah Desa Bungkuk')" class="text-[11px] px-2 py-0.5 rounded bg-slate-100 hover:bg-emerald-100 text-slate-700 font-medium">Desa</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Header Pemda</label>
            <input type="text" id="input-pemda" value="PEMKAB LAMPUNG SELATAN" oninput="updateLivePreview()" class="w-full px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama OPD / Sekolah / Desa</label>
            <input type="text" id="input-opd" value="SDN 1 Kalianda" oninput="updateLivePreview()" class="w-full px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 outline-none" />
          </div>
        </div>
      </div>

      <!-- 2. GENERATOR KODE BMD LAMSEL -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">2. Pengkodean BMD Lamsel</h2>
          <span class="text-[11px] font-mono-code bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded font-bold">Wilayah: 18.01</span>
        </div>

        <!-- Mode Pengkodean -->
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg">
          <button type="button" id="btn-mode-sederhana" onclick="setKodeMode('sederhana')" class="py-1.5 px-2 text-xs font-bold rounded-md bg-white text-emerald-800 shadow-sm transition">
            Mode Sederhana (Sekolah/Desa)
          </button>
          <button type="button" id="btn-mode-lengkap" onclick="setKodeMode('lengkap')" class="py-1.5 px-2 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition">
            Mode BMD Lengkap (BPKAD)
          </button>
        </div>

        <!-- Pilihan Kecamatan (Khusus Mode Sederhana) -->
        <div id="box-kecamatan">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kecamatan di Lampung Selatan</label>
          <select id="select-kecamatan" onchange="syncKodeBMD()" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
            <option value="04">04 - Natar</option>
            <option value="05">05 - Tanjung Bintang</option>
            <option value="06" selected>06 - Kalianda (Ibu Kota)</option>
            <option value="07">07 - Sidomulyo</option>
            <option value="08">08 - Katibung</option>
            <option value="09">09 - Penengahan</option>
            <option value="10">10 - Palas</option>
            <option value="11">11 - Jati Agung</option>
            <option value="12">12 - Ketapang</option>
            <option value="13">13 - Sragi</option>
            <option value="14">14 - Raja Basa</option>
            <option value="15">15 - Candipuro</option>
            <option value="16">16 - Merbau Mataram</option>
            <option value="17">17 - Bakauheni</option>
            <option value="18">18 - Tanjung Sari</option>
            <option value="19">19 - Way Sulan</option>
            <option value="20">20 - Way Panji</option>
          </select>
        </div>

        <!-- Jenis Barang Standar Lamsel -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">
